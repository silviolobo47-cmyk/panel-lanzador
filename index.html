<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel Administrador</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#060F13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{height:100%;}
  body{
    font-family:'SF Mono','Consolas',monospace;
    background: linear-gradient(150deg, #060F13 0%, #0B2233 45%, #123441 100%);
    color:#CBE3E3;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .panel{
    width:min(340px,88vw);
    background: rgba(18,45,58,0.55);
    border:1px solid rgba(148,197,197,0.18);
    border-radius:10px;
    padding:28px 22px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 20px 50px rgba(0,0,0,0.55);
    animation: rise .4s ease;
  }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .led{ display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .led-dot{ width:8px; height:8px; border-radius:50%; background:#4FD1C5; box-shadow:0 0 8px #4FD1C5; flex-shrink:0; }
  .led-dot.ok{ background:#4FD1C5; box-shadow:0 0 8px #4FD1C5; }
  .label{ font-size:0.68rem; letter-spacing:0.05em; color:#7FA3A3; }
  h1{ font-size:1.1rem; font-weight:600; color:#EAF6F6; margin-bottom:4px; }
  p.sub{ font-size:0.78rem; color:#7FA3A3; margin-bottom:22px; }

  .readout{
    background:rgba(6,15,19,0.6); border:1px solid rgba(148,197,197,0.18); border-radius:6px;
    padding:14px; margin-bottom:20px; text-align:center;
    font-size:1.6rem; letter-spacing:0.5em; color:#4FD1C5;
    transition:color .15s;
  }
  .readout.err{ color:#E0716A; }

  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .key{
    padding:16px 0; font-size:1.05rem; font-weight:600;
    background:rgba(148,197,197,0.07); border:1px solid rgba(148,197,197,0.16); border-bottom:3px solid rgba(0,0,0,0.35);
    border-radius:6px; color:#CBE3E3;
  }
  .key:active{ border-bottom-width:1px; transform:translateY(2px); background:rgba(148,197,197,0.14); }
  .key.action{ font-size:0.72rem; color:#7FA3A3; }

  #menu{ display:none; }
  .app-link{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px; margin-bottom:8px;
    background:rgba(148,197,197,0.07); border:1px solid rgba(148,197,197,0.16); border-radius:6px;
    color:#CBE3E3; text-decoration:none; font-size:0.85rem;
  }
  .app-link::after{ content:"›"; color:#4FD1C5; }
  .app-link.disabled{ opacity:0.4; }

  #logout{
    width:100%; margin-top:6px; padding:10px; background:transparent;
    border:none; color:#7FA3A3; font-size:0.7rem; font-family:inherit;
  }
</style>
</head>
<body>

<div class="panel" id="login">
  <div class="led"><div class="led-dot"></div><div class="label">SD-ACCESO · ADMIN</div></div>
  <h1>Panel Administrador</h1>
  <p class="sub">Clave de acceso requerida</p>
  <div class="readout" id="readout">– – – –</div>
  <div class="keypad">
    <button class="key" onclick="press(1)">1</button>
    <button class="key" onclick="press(2)">2</button>
    <button class="key" onclick="press(3)">3</button>
    <button class="key" onclick="press(4)">4</button>
    <button class="key" onclick="press(5)">5</button>
    <button class="key" onclick="press(6)">6</button>
    <button class="key" onclick="press(7)">7</button>
    <button class="key" onclick="press(8)">8</button>
    <button class="key" onclick="press(9)">9</button>
    <button class="key action" onclick="clearPin()">CLR</button>
    <button class="key" onclick="press(0)">0</button>
    <button class="key action" onclick="back()">DEL</button>
  </div>
</div>

<div class="panel" id="menu">
  <div class="led"><div class="led-dot ok"></div><div class="label">ACCESO CONCEDIDO</div></div>
  <h1>Mis Apps</h1>
  <p class="sub">Seleccioná módulo</p>
  <a class="app-link" href="https://silviolobo47-cmyk.github.io/Discapacidad-/">Sección Discapacidad</a>
  <a class="app-link" href="https://silviolobo47-cmyk.github.io/MUNICIPIOS-INSTITUCIONES-CUPO/?admin=1">Cupos (admin)</a>
  <a class="app-link disabled" href="#" onclick="alert('Falta configurar la URL de Fichas Técnicas'); return false;">Fichas Técnicas</a>
  <button id="logout" onclick="logout()">Cerrar sesión</button>
</div>

<script>
const PIN = "4783";
let entered = "";
const SESSION_KEY = "sd_session";
const SESSION_HOURS = 12;

function checkSession(){
  const raw = localStorage.getItem(SESSION_KEY);
  if(!raw) return false;
  try{ const s = JSON.parse(raw); if(Date.now() < s.expires) return true; }catch(e){}
  return false;
}
function showMenu(){ document.getElementById('login').style.display='none'; document.getElementById('menu').style.display='block'; }
function showLogin(){ document.getElementById('menu').style.display='none'; document.getElementById('login').style.display='block'; }

function render(err){
  const r = document.getElementById('readout');
  r.classList.toggle('err', !!err);
  if(err){ r.textContent = "ERROR"; return; }
  r.textContent = (entered.split('').join(' ') + '  – '.repeat(4-entered.length)).trim() || "– – – –";
}
function press(n){ if(entered.length>=4) return; entered+=n; render(); if(entered.length===4) setTimeout(validate,150); }
function back(){ entered = entered.slice(0,-1); render(); }
function clearPin(){ entered=""; render(); }
function validate(){
  if(entered === PIN){
    const expires = Date.now() + SESSION_HOURS*60*60*1000;
    localStorage.setItem(SESSION_KEY, JSON.stringify({expires}));
    showMenu();
  } else {
    render(true);
    setTimeout(()=>{ entered=""; render(); }, 900);
  }
}
function logout(){ localStorage.removeItem(SESSION_KEY); showLogin(); }

render();
if(checkSession()) showMenu();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
